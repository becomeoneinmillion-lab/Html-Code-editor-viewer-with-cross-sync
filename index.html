<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Studio & Version Tracker</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --surface: #252538;
      --border: #383850;
      --text: #cdd6f4;
      --accent: #89b4fa;
      --success: #a6e3a1;
      --warning: #f9e2af;
      --error: #f38ba8;
      --gutter-bg: #181825;
      --gutter-color: #6c7086;
      --active-line: rgba(137, 180, 250, 0.08);
      --editor-font: "JetBrains Mono", Consolas, Menlo, "Courier New", monospace;
      --line-height: 21px;
      --font-size: 13px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      justify-content: space-between;
      z-index: 10;
    }
    .header-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input, button, select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
    }
    input:focus, select:focus {
      outline: 1px solid var(--accent);
      border-color: var(--accent);
    }
    button {
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s ease;
    }
    button:hover { background: #313244; }
    button.primary { background: #45475a; border-color: var(--accent); color: var(--accent); }
    button.primary:hover { background: var(--accent); color: #11111b; }
    .badge {
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 3px;
      background: #313244;
      color: var(--warning);
      font-weight: bold;
    }
    main {
      display: flex;
      flex: 1;
      height: calc(100vh - 55px);
      position: relative;
    }
    .editor-pane, .preview-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      height: 100%;
    }
    .editor-pane {
      border-right: 1px solid var(--border);
    }
    .pane-header {
      background: #181825;
      padding: 6px 12px;
      font-size: 12px;
      color: #a6adc8;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    
    /* Code Editor Container with Line Numbers */
    .editor-workspace {
      display: flex;
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #181825;
    }
    .gutter {
      width: 52px;
      padding: 12px 0;
      background: var(--gutter-bg);
      border-right: 1px solid var(--border);
      color: var(--gutter-color);
      font-family: var(--editor-font);
      font-size: var(--font-size);
      line-height: var(--line-height);
      text-align: right;
      user-select: none;
      overflow: hidden;
      flex-shrink: 0;
    }
    .gutter-line {
      padding-right: 10px;
      height: var(--line-height);
      cursor: pointer;
    }
    .gutter-line:hover {
      color: var(--accent);
    }
    .textarea-wrapper {
      position: relative;
      flex: 1;
      height: 100%;
      overflow: hidden;
    }
    textarea {
      width: 100%;
      height: 100%;
      background: transparent;
      color: var(--text);
      border: none;
      resize: none;
      font-family: var(--editor-font);
      font-size: var(--font-size);
      line-height: var(--line-height);
      padding: 12px 14px;
      outline: none;
      tab-size: 2;
      white-space: pre;
      overflow: auto;
      word-break: normal;
    }
    
    /* Search & Replace Floating Bar */
    .search-panel {
      position: absolute;
      top: 36px;
      right: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      z-index: 50;
      width: 330px;
    }
    .search-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .search-row input {
      flex: 1;
      padding: 4px 8px;
      font-size: 12px;
    }
    .search-row button {
      padding: 4px 8px;
      font-size: 11px;
    }
    .search-stats {
      font-size: 11px;
      color: var(--gutter-color);
      min-width: 45px;
      text-align: center;
    }

    iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #ffffff;
    }
    #status {
      font-size: 12px;
      color: var(--success);
      margin-left: 8px;
    }
    .pos-indicator {
      font-family: var(--editor-font);
      font-size: 11px;
      color: var(--gutter-color);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-group">
      <label for="baseFileName">Base Name:</label>
      <input type="text" id="baseFileName" value="app" style="width: 110px;" placeholder="Filename">
      <span class="badge" id="versionBadge">v1.0</span>
      <button class="primary" id="pasteAiBtn" title="Detects code updates and auto-increments version">Paste AI Code (+0.1)</button>
      <button id="majorIncBtn" title="Bump major release">+1.0 Major</button>
    </div>

    <div class="header-group">
      <input type="password" id="gasUrl" placeholder="Paste Apps Script Web App URL" style="width: 210px;">
      <button id="saveDriveBtn">Sync to Drive</button>
      <button id="loadDriveBtn">Pull from Drive</button>
      <span id="status"></span>
    </div>
  </header>

  <main>
    <section class="editor-pane">
      <div class="pane-header">
        <span id="resolvedName">app_v1.0.html</span>
        <div style="display: flex; gap: 8px; align-items: center;">
          <span class="pos-indicator" id="cursorPos">Ln 1, Col 1</span>
          <button id="searchToggleBtn" style="padding: 2px 8px; font-size: 11px;">Find (Ctrl+F)</button>
          <button id="gotoLineBtn" style="padding: 2px 8px; font-size: 11px;">Go to Line (Ctrl+G)</button>
          <button id="runCodeBtn" style="padding: 2px 8px; font-size: 11px;">Update Preview</button>
        </div>
      </div>

      <!-- Integrated Floating Find / Replace Box -->
      <div class="search-panel" id="searchPanel">
        <div class="search-row">
          <input type="text" id="findInput" placeholder="Find...">
          <span class="search-stats" id="searchCount">0/0</span>
          <button id="findPrevBtn" title="Previous match">▲</button>
          <button id="findNextBtn" title="Next match">▼</button>
          <button id="closeSearchBtn" style="color: var(--error);">✕</button>
        </div>
        <div class="search-row">
          <input type="text" id="replaceInput" placeholder="Replace with...">
          <button id="replaceBtn">Replace</button>
          <button id="replaceAllBtn">All</button>
        </div>
      </div>

      <div class="editor-workspace">
        <div class="gutter" id="lineGutter">
          <div class="gutter-line">1</div>
        </div>
        <div class="textarea-wrapper">
          <textarea id="codeEditor" spellcheck="false" placeholder="<!-- Paste raw code or click 'Paste AI Code' -->"></textarea>
        </div>
      </div>
    </section>

    <section class="preview-pane">
      <div class="pane-header">
        <span>Sandboxed Live Preview</span>
      </div>
      <iframe id="previewFrame" sandbox="allow-scripts allow-modals allow-forms allow-same-origin"></iframe>
    </section>
  </main>

  <script>
    let major = 1;
    let minor = 0;
    let currentFileId = null;

    const baseNameInput = document.getElementById("baseFileName");
    const versionBadge = document.getElementById("versionBadge");
    const resolvedName = document.getElementById("resolvedName");
    const codeEditor = document.getElementById("codeEditor");
    const lineGutter = document.getElementById("lineGutter");
    const previewFrame = document.getElementById("previewFrame");
    const gasUrlInput = document.getElementById("gasUrl");
    const statusText = document.getElementById("status");
    const cursorPos = document.getElementById("cursorPos");

    // Search elements
    const searchPanel = document.getElementById("searchPanel");
    const findInput = document.getElementById("findInput");
    const replaceInput = document.getElementById("replaceInput");
    const searchCount = document.getElementById("searchCount");

    let matchIndices = [];
    let currentMatchIndex = -1;

    // Persist GAS URL locally
    gasUrlInput.value = localStorage.getItem("gas_sync_url") || "";
    gasUrlInput.addEventListener("change", () => {
      localStorage.setItem("gas_sync_url", gasUrlInput.value.trim());
    });

    function updateVersionDisplay() {
      const versionStr = `v${major}.${minor}`;
      versionBadge.textContent = versionStr;
      const cleanBase = baseNameInput.value.trim().replace(/\.[^/.]+$/, "");
      resolvedName.textContent = `${cleanBase}_${versionStr}.html`;
    }

    baseNameInput.addEventListener("input", updateVersionDisplay);

    function updatePreview() {
      const blob = new Blob([codeEditor.value], { type: "text/html" });
      previewFrame.src = URL.createObjectURL(blob);
    }

    // Line Numbers & Gutter Management
    function updateLineNumbers() {
      const lines = codeEditor.value.split("\n");
      const totalLines = lines.length || 1;
      
      let gutterHTML = "";
      for (let i = 1; i <= totalLines; i++) {
        gutterHTML += `<div class="gutter-line" data-line="${i}">${i}</div>`;
      }
      lineGutter.innerHTML = gutterHTML;
      lineGutter.scrollTop = codeEditor.scrollTop;
    }

    function updateCursorInfo() {
      const text = codeEditor.value.substring(0, codeEditor.selectionStart);
      const lines = text.split("\n");
      const currentLine = lines.length;
      const currentCol = lines[lines.length - 1].length + 1;
      cursorPos.textContent = `Ln ${currentLine}, Col ${currentCol}`;
    }

    // Synchronize scrolling between editor and gutter
    codeEditor.addEventListener("scroll", () => {
      lineGutter.scrollTop = codeEditor.scrollTop;
    });

    codeEditor.addEventListener("input", () => {
      updateLineNumbers();
      updateCursorInfo();
      clearTimeout(window.previewTimeout);
      window.previewTimeout = setTimeout(updatePreview, 400);
    });

    codeEditor.addEventListener("click", updateCursorInfo);
    codeEditor.addEventListener("keyup", (e) => {
      updateCursorInfo();
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
        updateCursorInfo();
      }
    });

    // Go to line functionality (Clicking line number or shortcut)
    lineGutter.addEventListener("click", (e) => {
      if (e.target.classList.contains("gutter-line")) {
        goToLine(parseInt(e.target.getAttribute("data-line"), 10));
      }
    });

    function goToLine(targetLineNumber) {
      if (isNaN(targetLineNumber) || targetLineNumber < 1) return;
      const lines = codeEditor.value.split("\n");
      if (targetLineNumber > lines.length) targetLineNumber = lines.length;

      let charIndex = 0;
      for (let i = 0; i < targetLineNumber - 1; i++) {
        charIndex += lines[i].length + 1;
      }

      codeEditor.focus();
      codeEditor.setSelectionRange(charIndex, charIndex + lines[targetLineNumber - 1].length);

      // Scroll cursor into view
      const lineHeight = 21;
      codeEditor.scrollTop = (targetLineNumber - 3) * lineHeight;
      lineGutter.scrollTop = codeEditor.scrollTop;
      updateCursorInfo();
    }

    document.getElementById("gotoLineBtn").addEventListener("click", () => {
      const line = prompt("Jump to line number:");
      if (line) goToLine(parseInt(line, 10));
    });

    // Integrated Search and Replace
    function openSearch() {
      searchPanel.style.display = "flex";
      findInput.focus();
      findInput.select();
      performFind();
    }

    function closeSearch() {
      searchPanel.style.display = "none";
      codeEditor.focus();
    }

    document.getElementById("searchToggleBtn").addEventListener("click", openSearch);
    document.getElementById("closeSearchBtn").addEventListener("click", closeSearch);

    function performFind() {
      const term = findInput.value;
      matchIndices = [];
      currentMatchIndex = -1;

      if (!term) {
        searchCount.textContent = "0/0";
        return;
      }

      const content = codeEditor.value.toLowerCase();
      const searchStr = term.toLowerCase();
      let pos = content.indexOf(searchStr);

      while (pos !== -1) {
        matchIndices.push(pos);
        pos = content.indexOf(searchStr, pos + searchStr.length);
      }

      if (matchIndices.length > 0) {
        currentMatchIndex = 0;
        selectCurrentMatch();
      } else {
        searchCount.textContent = "0/0";
      }
    }

    function selectCurrentMatch() {
      if (currentMatchIndex < 0 || currentMatchIndex >= matchIndices.length) return;
      searchCount.textContent = `${currentMatchIndex + 1}/${matchIndices.length}`;

      const startIndex = matchIndices[currentMatchIndex];
      const matchLen = findInput.value.length;

      codeEditor.focus();
      codeEditor.setSelectionRange(startIndex, startIndex + matchLen);

      // Auto-scroll calculation
      const linesBefore = codeEditor.value.substring(0, startIndex).split("\n").length;
      codeEditor.scrollTop = (linesBefore - 4) * 21;
      lineGutter.scrollTop = codeEditor.scrollTop;
      updateCursorInfo();
    }

    findInput.addEventListener("input", performFind);

    document.getElementById("findNextBtn").addEventListener("click", () => {
      if (!matchIndices.length) return;
      currentMatchIndex = (currentMatchIndex + 1) % matchIndices.length;
      selectCurrentMatch();
    });

    document.getElementById("findPrevBtn").addEventListener("click", () => {
      if (!matchIndices.length) return;
      currentMatchIndex = (currentMatchIndex - 1 + matchIndices.length) % matchIndices.length;
      selectCurrentMatch();
    });

    document.getElementById("replaceBtn").addEventListener("click", () => {
      if (currentMatchIndex === -1 || !matchIndices.length) return;
      const start = matchIndices[currentMatchIndex];
      const len = findInput.value.length;
      const rep = replaceInput.value;

      codeEditor.setRangeText(rep, start, start + len, "select");
      updateLineNumbers();
      updatePreview();
      performFind();
    });

    document.getElementById("replaceAllBtn").addEventListener("click", () => {
      const term = findInput.value;
      if (!term) return;
      const regex = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
      codeEditor.value = codeEditor.value.replace(regex, replaceInput.value);
      updateLineNumbers();
      updatePreview();
      performFind();
    });

    // Keyboard Shortcuts (Ctrl+F, Ctrl+G, Escape, Tab Key Indent)
    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f") {
        e.preventDefault();
        openSearch();
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "g") {
        e.preventDefault();
        const line = prompt("Jump to line number:");
        if (line) goToLine(parseInt(line, 10));
      }
      if (e.key === "Escape" && searchPanel.style.display === "flex") {
        closeSearch();
      }
    });

    // Indent handling on Tab
    codeEditor.addEventListener("keydown", (e) => {
      if (e.key === "Tab") {
        e.preventDefault();
        const start = codeEditor.selectionStart;
        const end = codeEditor.selectionEnd;
        codeEditor.setRangeText("  ", start, end, "end");
        updateLineNumbers();
      }
    });

    document.getElementById("runCodeBtn").addEventListener("click", updatePreview);

    // AI Paste Handler: Strips code fences and increments version
    document.getElementById("pasteAiBtn").addEventListener("click", async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (!text) return;

        let cleanCode = text;
        const markdownMatch = text.match(/```(?:html|javascript|css)?\s*([\s\S]*?)```/i);
        if (markdownMatch && markdownMatch[1]) {
          cleanCode = markdownMatch[1].trim();
        }

        if (codeEditor.value.trim() !== cleanCode.trim()) {
          codeEditor.value = cleanCode;
          minor += 1;
          currentFileId = null;
          updateVersionDisplay();
          updateLineNumbers();
          updatePreview();
          showStatus(`Imported & bumped to v${major}.${minor}`);
        } else {
          showStatus("Code matches current editor content");
        }
      } catch (err) {
        showStatus("Clipboard access error: " + err.message, true);
      }
    });

    document.getElementById("majorIncBtn").addEventListener("click", () => {
      major += 1;
      minor = 0;
      currentFileId = null;
      updateVersionDisplay();
      showStatus(`Bumped to v${major}.${minor}`);
    });

    function showStatus(msg, isError = false) {
      statusText.textContent = msg;
      statusText.style.color = isError ? "var(--error)" : "var(--success)";
      setTimeout(() => { statusText.textContent = ""; }, 4000);
    }

    // Google Apps Script Sync - POST (Save)
    document.getElementById("saveDriveBtn").addEventListener("click", async () => {
      const url = gasUrlInput.value.trim();
      if (!url) return showStatus("Enter Apps Script URL first", true);

      showStatus("Syncing to Drive...");
      try {
        const payload = {
          action: "save",
          filename: resolvedName.textContent,
          content: codeEditor.value,
          fileId: currentFileId
        };

        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        if (result.status === "success") {
          currentFileId = result.fileId;
          showStatus(`Saved: ${result.name}`);
        } else {
          showStatus(`Save failed: ${result.message}`, true);
        }
      } catch (err) {
        showStatus("Network / CORS error syncing to Drive", true);
      }
    });

    // Google Apps Script Pull - GET (Load)
    document.getElementById("loadDriveBtn").addEventListener("click", async () => {
      const url = gasUrlInput.value.trim();
      if (!url) return showStatus("Enter Apps Script URL first", true);

      showStatus("Fetching files...");
      try {
        const listRes = await fetch(`${url}?action=list`);
        const listData = await listRes.json();

        if (listData.status !== "success" || !listData.files.length) {
          return showStatus("No files found in Drive folder", true);
        }

        const options = listData.files.map((f, i) => `${i + 1}: ${f.name}`).join("\n");
        const pick = prompt(`Select file number to load:\n${options}`);
        const idx = parseInt(pick, 10) - 1;

        if (isNaN(idx) || idx < 0 || idx >= listData.files.length) return;

        const targetFile = listData.files[idx];
        showStatus(`Loading ${targetFile.name}...`);

        const fileRes = await fetch(`${url}?action=read&fileId=${targetFile.id}`);
        const fileData = await fileRes.json();

        if (fileData.status === "success") {
          codeEditor.value = fileData.content;
          currentFileId = targetFile.id;
          
          const verMatch = fileData.name.match(/_v(\d+)\.(\d+)\./);
          if (verMatch) {
            major = parseInt(verMatch[1], 10);
            minor = parseInt(verMatch[2], 10);
          }
          const baseMatch = fileData.name.replace(/_v\d+\.\d+\..*$/, "");
          if (baseMatch) baseNameInput.value = baseMatch;

          updateVersionDisplay();
          updateLineNumbers();
          updatePreview();
          showStatus(`Loaded ${fileData.name}`);
        } else {
          showStatus(`Read failed: ${fileData.message}`, true);
        }
      } catch (err) {
        showStatus("Error pulling from Drive", true);
      }
    });

    // Initial setup
    updateVersionDisplay();
    updateLineNumbers();
  </script>
</body>
</html>
